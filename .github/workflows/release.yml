# On a vX.Y.Z tag (git tag v0.1.0 && git push origin v0.1.0): build the .deb (one package for Ubuntu 24.04 and Debian 13) and the .rpm, install them in clean containers and start the daemon,
# build and publish the Docker image, then attach the packages to a GitHub release. The tag must match EMULED_VERSION in CMakeLists.txt.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  deb:
    # amd64 and arm64 (Raspberry Pi 3/4/5 with a 64-bit system, Bench 911): native GitHub runners, free on public repositories
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches EMULED_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^set(EMULED_VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          [ "v$v" = "${{ github.ref_name }}" ] || { echo "tag ${{ github.ref_name }} but CMakeLists.txt says EMULED_VERSION $v"; exit 1; }
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: sudo apt-get update && grep -vE '^\s*(#|$)' requirements-apt.txt | xargs sudo apt-get install -y
      - run: python3 tools/fix_case.py && (cd web && npm ci --no-audit --no-fund && npm run build)
      # miniupnpc is linked statically (EMULED_STATIC_MINIUPNPC): its shared library has a different name on Ubuntu 24.04 (libminiupnpc17) and Debian 13 (libminiupnpc18)
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DEMULED_STATIC_MINIUPNPC=ON && cmake --build build
      - run: ctest --test-dir build --output-on-failure --timeout 300 --repeat until-pass:3
      - run: (cd build && cpack -G DEB)
      - name: Install the same .deb in clean Ubuntu 24.04 and Debian 13 containers and start the daemon
        run: |
          for img in ubuntu:24.04 debian:13; do
            docker run --rm -v "$PWD/build":/pkgs:ro $img bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /pkgs/*.deb && test -d /usr/share/emuled/templates/console && emuled --offline --max-seconds 3 --api-port 18790'
          done
      - uses: actions/upload-artifact@v4
        with: { name: "deb-${{ matrix.arch }}", path: build/*.deb }

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - run: dnf install -y gcc-c++ cmake ninja-build pkgconf-pkg-config flex bison python3 rpm-build git cryptopp-devel miniupnpc-devel zlib-devel libcurl-devel json-devel nodejs npm
      - uses: actions/checkout@v5
      - run: python3 tools/fix_case.py && (cd web && npm ci --no-audit --no-fund && npm run build)
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr && cmake --build build --target emuled && (cd build && cpack -G RPM)
      - name: Install the .rpm and start the daemon
        run: dnf install -y build/*.rpm && test -d /usr/share/emuled/templates/console && emuled --offline --max-seconds 3 --api-port 18790
      - uses: actions/upload-artifact@v4
        with: { name: rpm, path: build/*.rpm }

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  release:
    needs: [deb, rpm, docker]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # only the packages: the Docker build also leaves a *.dockerbuild artifact that cannot be downloaded
      - uses: actions/download-artifact@v4
        with: { pattern: "deb-*", merge-multiple: true, path: artifacts }
      - uses: actions/download-artifact@v4
        with: { name: rpm, path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
