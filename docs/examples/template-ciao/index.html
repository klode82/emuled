<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hello world - emuled</title>
</head>
<body>
<h1>Hello world</h1>

<!-- Login: the code (token) lives in the browser under the key emuled.token, the same for all templates: if it is already there, it is not asked for again -->
<form id="login" hidden>
  <p>Paste the token (the <code>emuled.token</code> file in the profile folder).</p>
  <input id="token" type="password" autocomplete="off" aria-label="Token">
  <button>Sign in</button>
  <p id="errore" role="alert"></p>
</form>

<section id="main" hidden>
  <p id="stato">...</p>
  <h2>Downloads</h2>
  <ul id="lista"></ul>
  <!-- Every template must give a way to change the look: /?template=console leads to A, where it is chosen in Preferences -->
  <p><a href="/?template=console">Change look</a> &middot; <button id="esci">Sign out</button></p>
</section>

<script>
// Addresses RELATIVE to the template (they do not start with /): the template lives in /t/<id>/, but the API is always at /api/v1/ (written absolute here because it belongs to the daemon)
var KEY = 'emuled.token';
function token() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function api(path) {
  return fetch('/api/v1' + path, { headers: { Authorization: 'Bearer ' + token() } }).then(function (r) {
    if (r.status === 401) { throw new Error('401'); }
    return r.json();
  });
}
function show(logged) { document.getElementById('login').hidden = logged; document.getElementById('main').hidden = !logged; }
function aggiorna() {
  Promise.all([api('/status'), api('/downloads')]).then(function (x) {
    var s = x[0], d = x[1];
    // textContent, never innerHTML with daemon data: file names are decided by whoever shares them
    document.getElementById('stato').textContent = 'Downloading at ' + Math.round(s.transfers.download_speed / 1024) + ' KB/s, uploading at ' + Math.round(s.transfers.upload_speed / 1024) + ' KB/s';
    var ul = document.getElementById('lista'); ul.textContent = '';
    d.forEach(function (f) { var li = document.createElement('li'); li.textContent = f.name + ' - ' + Math.floor(f.percent) + '%'; ul.appendChild(li); });
  }).catch(function (e) {
    if (String(e.message) === '401') {
      try { localStorage.removeItem(KEY); } catch (z) {}
      document.getElementById('token').value = '';
      document.getElementById('errore').textContent = 'Invalid token: try again.';
      clearInterval(timer); show(false);
    }
  });
}
document.getElementById('login').addEventListener('submit', function (ev) {
  ev.preventDefault();
  document.getElementById('errore').textContent = '';
  try { localStorage.setItem(KEY, document.getElementById('token').value.trim()); } catch (e) {}
  start();
});
document.getElementById('esci').addEventListener('click', function () { try { localStorage.removeItem(KEY); } catch (e) {} start(); });
var timer;
function start() {
  clearInterval(timer);
  if (!token()) { show(false); return; }
  show(true); aggiorna(); timer = setInterval(aggiorna, 3000);	// simple: it reads again every 3 seconds (the WebSocket /api/v1/events?token=... avoids polling)
}
start();
</script>
</body>
</html>
